<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh's Wishlist</title>
    <meta name="description" content="Gift ideas for Josh's birthday and Christmas, ranked by how much he wants them.">
    <meta property="og:title" content="Josh's Wishlist">
    <meta property="og:description" content="Gift ideas for my birthday and Christmas, ranked by how much I want them.">
    <meta property="og:type" content="website">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#D8D6DE">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FF7F7F'/%3E%3Ctext x='16' y='23' font-family='Arial Black,sans-serif' font-size='20' font-weight='900' text-anchor='middle' fill='%231C1B22'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Rubik+Mono+One&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header class="masthead">
            <h1 class="wordmark" data-action="secret-tap"><span>Josh<span class="apos">’</span>s</span> <span>Wishlist</span></h1>
            <p class="intro">Gift ideas for my birthday and Christmas, ranked by how much I want them. Tap one to see it.</p>
        </header>

        <main id="main">
            <section id="list-view" aria-label="Wishlist">
                <div class="controls">
                    <label class="search">
                        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
                        <input id="search" type="search" placeholder="Search gifts" aria-label="Search gifts" autocomplete="off">
                    </label>
                    <div class="filter" role="group" aria-labelledby="budget-label">
                        <span class="filter-label" id="budget-label">Budget</span>
                        <div class="chips" id="budget-chips">
                            <button class="chip" data-action="budget" data-budget="" aria-pressed="true">Any price</button>
                            <button class="chip" data-action="budget" data-budget="20" aria-pressed="false">Up to $20</button>
                            <button class="chip" data-action="budget" data-budget="30" aria-pressed="false">Up to $30</button>
                            <button class="chip" data-action="budget" data-budget="50" aria-pressed="false">Up to $50</button>
                            <button class="chip" data-action="budget" data-budget="100" aria-pressed="false">Up to $100</button>
                        </div>
                    </div>
                    <div class="filter" role="group" aria-labelledby="project-label">
                        <span class="filter-label" id="project-label">Project</span>
                        <div class="chips" id="project-chips">
                            <button class="chip" data-action="project" data-project="" aria-pressed="true">All projects</button>
                        </div>
                    </div>
                </div>

                <div class="summary">
                    <p id="summary" class="summary-text" aria-live="polite">Loading gift ideas…</p>
                    <button id="clear-filters" class="text-btn" data-action="clear-filters" hidden>Clear filters</button>
                </div>
                <p id="project-note" class="project-note" hidden></p>

                <!-- Rows are pre-rendered so the page doesn't jump when the data arrives -->
                <div id="tiers" class="tiers">
                    <div class="tier"><div class="tier-label tier-S"><span class="tier-badge"><span class="tier-letter">S</span><span class="tier-word">Dream</span></span></div><div class="tier-items is-loading"></div></div>
                    <div class="tier"><div class="tier-label tier-A"><span class="tier-badge"><span class="tier-letter">A</span><span class="tier-word">Want</span></span></div><div class="tier-items is-loading"></div></div>
                    <div class="tier"><div class="tier-label tier-B"><span class="tier-badge"><span class="tier-letter">B</span><span class="tier-word">Like</span></span></div><div class="tier-items is-loading"></div></div>
                    <div class="tier"><div class="tier-label tier-C"><span class="tier-badge"><span class="tier-letter">C</span><span class="tier-word">Maybe</span></span></div><div class="tier-items is-loading"></div></div>
                </div>

                <p class="list-foot"><button id="toggle-bought" class="text-btn" data-action="toggle-bought" hidden></button></p>
            </section>

            <section id="admin-view" hidden></section>
        </main>

        <footer class="site-foot">
            <a href="https://github.com/testler/Wish-list">See how this site is built</a>
        </footer>
    </div>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>

    <div id="toast-stack" class="toast-stack" popover="manual" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
</body>
</html>
