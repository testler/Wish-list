<!DOCTYPE html>

    <!-- Styles are inline: this page is served for any missing path, so relative links to style.css would break -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; }
        html { font-size: 106.25%; }
        body {
            background: #D8D6DE;
            color: #1C1B22;
            font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        :focus-visible { outline: 3px solid #4B3FB0; outline-offset: 2px; }
        .page { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
        .wordmark {
            display: inline-block;
            margin-bottom: 28px;
            font-family: 'Rubik Mono One', 'Arial Black', sans-serif;
            font-size: clamp(2rem, 9.5vw, 3.4rem);
            line-height: 0.95;
            letter-spacing: -0.02em;
            color: inherit;
            text-decoration: none;
        }
        .apos { margin: 0 -0.3em; }
        .tier {
            display: grid;
            grid-template-columns: 64px 1fr;
            background: #23232A;
            border-radius: 14px;
            overflow: hidden;
        }
        .tier-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 4px;
            background: #7FFF7F;
        }
        .tier-letter { font-family: 'Rubik Mono One', 'Arial Black', sans-serif; font-size: 1.953rem; line-height: 1; }

        .tier-body { padding: 18px 20px 22px; color: #FFFFFF; }
        h1 { font-size: 1.25rem; line-height: 1.3; }
        p { margin-top: 6px; color: #C9C7D2; max-width: 30rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 50px;
            margin-top: 18px;
            padding: 0 20px;
            border-radius: 12px;
            background: #4B3FB0;
            color: #FFFFFF;
            font-weight: 700;
            text-decoration: none;
        }
        .btn:hover { background: #3A3091; }
        .btn:focus-visible { outline-color: #FFFFFF; }
        @media (min-width: 720px) {
            .page { padding: 64px 32px; }
            .tier { grid-template-columns: 96px 1fr; }
            .tier-letter { font-size: 2.6rem; }
            .tier-word { font-size: 0.85rem; }
            .tier-body { padding: 24px 28px 28px; }

<body>

            <div class="tier-body">
                <h1>This page isn't on the list.</h1>
                <p>The link might be old or mistyped. Everything I'm hoping for is on the main list.</p>
                <a class="btn" href="/Wish-list/">Go to the wishlist</a>
            </div>
        </div>
    </main>
</body>
